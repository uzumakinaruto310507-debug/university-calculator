
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Scientific Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Scientific Calculator</h1>
        <p>University Student Calculator</p>

        <!-- Scientific Calculator -->
        <div class="box">
            <h2>Scientific Calculator</h2>

            <input type="text" id="display" readonly placeholder="0">

            <div class="buttons">
                <button onclick="clearDisplay()">C</button>
                <button onclick="deleteLast()">DEL</button>
                <button onclick="calculate('sqrt')">√</button>
                <button onclick="calculate('square')">x²</button>

                <button onclick="calculate('sin')">sin</button>
                <button onclick="calculate('cos')">cos</button>
                <button onclick="calculate('tan')">tan</button>
                <button onclick="calculate('log')">log</button>

                <button onclick="appendValue('7')">7</button>
                <button onclick="appendValue('8')">8</button>
                <button onclick="appendValue('9')">9</button>
                <button onclick="appendValue('/')">÷</button>

                <button onclick="appendValue('4')">4</button>
                <button onclick="appendValue('5')">5</button>
                <button onclick="appendValue('6')">6</button>
                <button onclick="appendValue('*')">×</button>

                <button onclick="appendValue('1')">1</button>
                <button onclick="appendValue('2')">2</button>
                <button onclick="appendValue('3')">3</button>
                <button onclick="appendValue('-')">−</button>

                <button onclick="appendValue('0')">0</button>
                <button onclick="appendValue('.')">.</button>
                <button onclick="appendValue('(')">(</button>
                <button onclick="appendValue(')')">)</button>

                <button onclick="appendValue('+')">+</button>
                <button onclick="appendValue('**')">xʸ</button>
                <button onclick="calculateResult()" class="equal">=</button>
            </div>
        </div>

        <!-- CGPA Calculator -->
        <div class="box">
            <h2>University CGPA Calculator</h2>

            <p>Enter subject credits and grade points.</p>

            <div id="subjects">
                <div class="subject">
                    <input type="number" placeholder="Credit" class="credit">
                    <input type="number" placeholder="Grade Point" class="grade">
                </div>
            </div>

            <button onclick="addSubject()" class="add">+ Add Subject</button>
            <button onclick="calculateCGPA()" class="calculate">Calculate CGPA</button>

            <h3 id="cgpaResult">CGPA: -</h3>
            <h3 id="percentageResult">Percentage: -</h3>

            <p class="note">
                Percentage conversion depends on your university.
                The default formula is CGPA × 10.
            </p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
